[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "knowledge-validation-service"
version = "0.1.0"
description = "Knowledge-Based Validation Service prototype (PhD thesis)"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Yahya Poursoltani", email = "yahya.poursoltani@gmail.com" }]
dependencies = ["neo4j>=5.26,<6"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "integration: requires a running Neo4j instance and NEO4J_* environment variables",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
