name: kbvs-prototype

services:
  neo4j:
    image: neo4j:2026.05-community
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:?set NEO4J_PASSWORD in .env or the environment}
      KBVS_NEO4J_USER: ${NEO4J_USER:-neo4j}
      KBVS_NEO4J_PASSWORD: ${NEO4J_PASSWORD:?set NEO4J_PASSWORD in .env or the environment}
    volumes:
      - neo4j_data:/data
    healthcheck:
      test:
        - CMD-SHELL
        - 'cypher-shell -a bolt://localhost:7687 -u "$${KBVS_NEO4J_USER}" -p "$${KBVS_NEO4J_PASSWORD}" "RETURN 1" > /dev/null 2>&1'
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

volumes:
  neo4j_data:
